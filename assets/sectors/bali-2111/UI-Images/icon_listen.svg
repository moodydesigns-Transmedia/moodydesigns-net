<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" fill="none">
  <defs>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Soundwaves -->
  <path d="M 45 42 C 38 48 38 72 45 78" stroke="#f7931e" stroke-width="3" stroke-linecap="round" />
  <path d="M 32 32 C 22 42 22 78 32 88" stroke="#f7931e" stroke-width="3.2" stroke-linecap="round" filter="url(#glow-orange)" />
  <path d="M 19 22 C 5 36 5 84 19 98" stroke="#f7931e" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-orange)" />

  <!-- Right Soundwaves -->
  <path d="M 155 42 C 162 48 162 72 155 78" stroke="#f7931e" stroke-width="3" stroke-linecap="round" />
  <path d="M 168 32 C 178 42 178 78 168 88" stroke="#f7931e" stroke-width="3.2" stroke-linecap="round" filter="url(#glow-orange)" />
  <path d="M 181 22 C 195 36 195 84 181 98" stroke="#f7931e" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-orange)" />

  <!-- Headphones Headband -->
  <path d="M 68 52 C 68 24 132 24 132 52" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Headphones Ear Cushions -->
  <rect x="63" y="44" width="9" height="26" rx="4.5" fill="#ffffff" />
  <rect x="128" y="44" width="9" height="26" rx="4.5" fill="#ffffff" />

  <!-- Eye Contour -->
  <path d="M 60 60 C 74 38 126 38 140 60 C 126 82 74 82 60 60 Z" stroke="#f7931e" stroke-width="4" stroke-linejoin="round" fill="rgba(10, 10, 10, 0.4)" filter="url(#glow-orange)" />

  <!-- Eye Pupil / Play Circle -->
  <circle cx="100" cy="60" r="16" fill="#ffffff" />
  <!-- Play Triangle inside pupil -->
  <polygon points="96,52 108,60 96,68" fill="#f7931e" />
</svg>