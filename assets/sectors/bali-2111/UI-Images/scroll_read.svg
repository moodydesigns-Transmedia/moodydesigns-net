<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120" fill="none">
  <defs>
    <filter id="glow-orange-scroll" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Browser Window Outer Frame -->
  <rect x="18" y="14" width="104" height="92" rx="10" stroke="#f7931e" stroke-width="4.5" fill="rgba(15, 15, 18, 0.6)" filter="url(#glow-orange-scroll)" />

  <!-- Titlebar Separator -->
  <line x1="18" y1="36" x2="122" y2="36" stroke="#f7931e" stroke-width="3" />

  <!-- 3 Window Dots -->
  <circle cx="30" cy="25" r="2.5" fill="#ffffff" />
  <circle cx="39" cy="25" r="2.5" fill="#ffffff" />
  <circle cx="48" cy="25" r="2.5" fill="#ffffff" />

  <!-- Text / Content Lines -->
  <line x1="30" y1="48" x2="88" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="58" x2="88" y2="58" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="68" x2="88" y2="68" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="78" x2="72" y2="78" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="88" x2="80" y2="88" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Scroll Down Chevron Hints -->
  <path d="M 78 74 L 84 79 L 90 74" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 78 82 L 84 87 L 90 82" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Vertical Scroll Track & Thumb -->
  <rect x="100" y="44" width="12" height="50" rx="3" stroke="#f7931e" stroke-width="2" fill="none" />
  <rect x="101" y="45" width="10" height="22" rx="2" fill="#f7931e" />
</svg>